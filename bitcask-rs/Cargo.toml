[package]
name = "bitcask-rs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bench]]
name = "kv_bench"
harness = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
crc32fast = "1.5.0"
criterion = "0.8.2"
crossbeam-skiplist = "0.1.3"
env_logger = "0.11.9"
fs2 = "0.4.3"
fs_extra = "1.3.0"
jammdb = "0.11.0"
log = "0.4.29"
memmap2 = "0.9.10"
parking_lot = "0.12.5"
prost = { workspace = true }
rand = "0.10.0"
serde = { workspace = true, features = ["derive"] }
thiserror = "2.0.18"

[dev-dependencies]
tempfile = "3.22"
